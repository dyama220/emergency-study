 for(k=0;k<n;k++){var a=Math.random()*6.283,s=2+Math.random()*9;stars.push({x:w/2,y:h/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:3+Math.random()*7,h:Math.random()*360,t:Math.random()*6,life:60+Math.random()*50,age:0,rot:Math.random()*6});}
 for(k=0;k<n;k++)stars.push({x:Math.random()*w,y:Math.random()*h,vx:0,vy:0,r:2+Math.random()*6,h:Math.random()*360,t:Math.random()*6,life:50+Math.random()*40,age:-Math.random()*50,rot:Math.random()*6});

/* 虹色の流星：右上 → 左下 */
var cv=$("sky"),cx=cv.getContext("2d"),W=0,H=0,M=[],dpr=Math.min(window.devicePixelRatio||1,2);

function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);}
function mk(init){return{x:Math.random()*(W+300)+(init?0:150),y:init?Math.random()*H:-60-Math.random()*H*.5,v:2.2+Math.random()*3.6,l:70+Math.random()*130,w:1+Math.random()*1.8,h:Math.random()*360,a:.35+Math.random()*.55};}
function init(){M=[];var n=W<500?38:70;for(var k=0;k<n;k++)M.push(mk(true));}
var ang=Math.PI*0.72,dx=Math.cos(ang),dy=Math.sin(ang);
function frame(t){
 cx.clearRect(0,0,W,H);cx.lineCap="round";
 for(var k=0;k<M.length;k++){
  var m=M[k];m.x+=dx*m.v;m.y+=dy*m.v;
  if(m.x<-m.l||m.y>H+m.l){M[k]=m=mk(false);m.y=-30;}
  var tx=m.x-dx*m.l,ty=m.y-dy*m.l,g=cx.createLinearGradient(m.x,m.y,tx,ty),hh=(m.h+t*.03)%360;
  g.addColorStop(0,"hsla("+hh+",100%,70%,"+m.a+")");g.addColorStop(.5,"hsla("+((hh+60)%360)+",100%,62%,"+m.a*.5+")");g.addColorStop(1,"hsla("+((hh+120)%360)+",100%,60%,0)");
  cx.strokeStyle=g;cx.lineWidth=m.w;cx.beginPath();cx.moveTo(m.x,m.y);cx.lineTo(tx,ty);cx.stroke();
 }
 requestAnimationFrame(frame);
}
size();init();addEventListener("resize",function(){size();init();});
if(!still)requestAnimationFrame(frame);
})();
