{c:4,t:1,ic:"shield",ti:"落雷現場のリバーストリアージ",bi:["heart","shield"],k:"落雷現場では「心停止＝黒タグ」のルールが[[逆転]]する。",b:["落雷の心停止は、心筋の不可逆的な損傷ではなく[[電気的な一時停止]]であることが多いとされる。","胸骨圧迫・人工呼吸・AEDで心拍再開・社会復帰の可能性があるため、CPAは「何が何でも[[赤]]」。"]},
{c:4,t:1,ic:"warn",ti:"熱傷の緊急度・重症度判定",bi:["shield","warn"],k:"電撃傷は、その時点で即「[[赤（重症）]]」。",b:["電撃傷は皮膚の熱傷面積（%TBSA）が小さくても、原則すべて[[重症熱傷]]（CQ1-3／Artz・ABLS基準）。","「緑（軽症）だな」という安易な判断は、[[最悪のシナリオ]]の入口。"]},
{c:4,t:7,ic:"doc",ti:"自由記載問題",q:"高圧線に接触した作業員が、会話ができて「痛くない」と言っています。皮膚の傷は右手のひらの小さな焦げあとだけです。搬送中に注意すべき点を自分の言葉で書いてください。",kw:[["心電図","モニター","12誘導"],["不整脈","心室細動","VF"],["急変","悪化","あとから","時間"],["腫れ","脈","コンパートメント","血流"],["重症"]],model:"会話できても急変し得るため[[重症]]として扱い、[[心電図モニター]]で[[不整脈（VF）]]を監視する。手足の[[腫れ・脈]]を繰り返し確認し、意識や麻痺の変化も見る。",ex:"キーワード：心電図／不整脈・VF／急変／腫れ・脈／重症"},
{c:5,t:3,ic:"check",ti:"電撃傷での5つのポイント",na:1,big:1,si:["shield", "hand", "hand", "head", "heart"],k:"順番に落ち着いて観察し、「隠れた重症」を見つける。",st:["①[[3S]]：自分・現場・傷病者（電源遮断）","②体表の熱傷・出入口と屈側","③手足の腫れと脈","④意識・神経の変化","⑤心電図モニター・除細動パッド"]},
{c:5,t:1,ic:"heart",ti:"ガイドライン推奨と受傷直後の注意",bi:["heart", "hand", "shield"],k:"[[会話できても安心しない]]：あとから急に悪化することがある。",b:["CQ8-1：心電図モニター・12誘導心電図の実施を強く推奨（推奨度D）。病院到着まで波形を見続ける。","CQ8-2：血流障害に対する[[減張切開]]を強く推奨（推奨度D）。橈骨動脈・足背動脈の脈、しびれ、動かしにくさを繰り返し確認する。","救助者の安全が最優先。ケガ人にふれる前に[[電源遮断]]を確認し、二次感電を防ぐ。"]},
...[0,1,2,3].map(n=>({c:5,t:8,ic:"doc",ti:"総合シミュレーション "+(n+1)+" / 4",n:n})),
{c:5,t:4,ic:"check",ti:"まとめ：目に見えない命を救うために",sum:1,sub:"「体の中の火傷」を想像し、次の医療へしっかりつなぐ。"}
];
const N=S.length-1;
S[0].meta="全"+N+"枚・全"+(CH.length-1)+" Chapter＋タイトル画面";

/* ===== 共通 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const h=s=>esc(s).replace(/\[\[(.+?)\]\]/g,"<em>$1</em>");
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};
const IC={bolt:"M13 2 4 14h6l-1 8 9-12h-6z",heart:"M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z",head:"M12 3a7 7 0 0 0-7 7c0 3 1.5 4.5 3 6v5h8v-5c1.5-1.5 3-3 3-6a7 7 0 0 0-7-7z",hand:"M7 11V5a1.5 1.5 0 0 1 3 0v5V3.5a1.5 1.5 0 0 1 3 0V10V5a1.5 1.5 0 0 1 3 0v8c0 4-2 8-6 8-3 0-5-2-6-5l-2-4a1.5 1.5 0 0 1 3-1z",shield:"M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5z",warn:"M12 3 1 21h22zM11 10h2v5h-2zm0 6h2v2h-2z",check:"M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z",doc:"M6 2h8l6 6v14H6zM14 3v6h6"};
const ico=n=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="url(#ig)" fill-rule="evenodd" d="'+IC[n]+'"/></svg>';
const norm=s=>String(s).normalize("NFKC").replace(/\s/g,"").toLowerCase();
const stage=$("#stage");
let cur=0,busy=false;const done={},st={},res={};

/* ===== 画像 ===== */
function imgs(keys){
  const d=el("div","imgs");
  keys.forEach(k=>{
    const im=new Image();im.alt="スライド画像 "+k;im.loading="lazy";im.src=IMGS[k];
    im.onclick=()=>openLb(im.src,im.alt);
    im.onerror=()=>{const p=el("div","ph");p.textContent=IMGS[k]+"（画像未配置）";im.replaceWith(p)};
    d.append(im);
  });
  return d;
}
function openLb(src,alt){$("#lbi").src=src;$("#lbi").alt=alt;$("#lb").classList.add("on")}
function closeLb(){$("#lb").classList.remove("on")}
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb"||e.target.id==="lbx")closeLb()});

/* ===== カットイン ===== */
let cutT;
function cut(kind,txt,ex,nx){
  const c=$("#cut"),col={ok:"#3ab0ff",mid:"#8fd0ff",ng:"#ff6a8a"}[kind];
  const star='<svg viewBox="0 0 100 100"><polygon fill="'+col+'" points="50,5 61,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 39,38"/></svg>';
  const x='<svg viewBox="0 0 100 100"><path d="M20 20 80 80M80 20 20 80" stroke="'+col+'" stroke-width="14" stroke-linecap="round"/></svg>';
  c.innerHTML=(kind==="ng"?x:star)+"<b>"+esc(txt)+"</b>";
  clearTimeout(cutT);
  c.dataset.lock=nx?"1":"";
  if(ex){c.insertAdjacentHTML("beforeend",'<div class="cx">'+ex+'</div><button class="go">'+(nx?"次へ":"閉じる")+'</button>');c.querySelector("button").onclick=()=>{c.classList.remove("on");if(nx)go(cur+1)};c.classList.add("on")}
  else{c.classList.add("on");cutT=setTimeout(()=>c.classList.remove("on"),1800)}
}
function pop(t,ex){
  const c=$("#cut");clearTimeout(cutT);c.dataset.lock="";
  c.innerHTML='<b class="pt">'+esc(t)+'</b><div class="cx">'+h(ex)+'</div><button class="go">閉じる</button>';
  c.querySelector("button").onclick=()=>c.classList.remove("on");c.classList.add("on");
}
$("#cut").addEventListener("click",e=>{const c=$("#cut");if(!c.dataset.lock&&!e.target.closest(".cx,button"))c.classList.remove("on")});
const verdict=r=>r>=1?["ok","正解！"]:r>=0.4?["mid","まあ正解！"]:["ng","残念…"];

/* ===== スライド描画 ===== */
function listHtml(b,bi){return "<ul>"+b.map((x,j)=>Array.isArray(x)?'<li class="i">'+ico(x[0])+"<span>"+h(x[1])+"</span></li>":bi&&bi[j]?'<li class="i">'+ico(bi[j])+"<span>"+h(x)+"</span></li>":"<li><span>"+h(x)+"</span></li>").join("")+"</ul>"}
function render(i){
  const s=S[i],card=el("section","card t"+s.t);
  const badge='<span class="badge">Chapter 0'+s.c+"</span>";
  if(s.t===4){
    card.innerHTML='<div class="c">'+badge+"<div>"+ico(s.ic)+"</div><h2>"+h(s.ti)+"</h2><p>"+h(s.sub)+"</p>"+(s.meta?'<p class="note">'+esc(s.meta)+"</p>":"")+"</div>";
    if(s.sum)summary(card);
  }else{
    card.innerHTML=badge+'<div class="tt">'+ico(s.ic)+"<h2>"+h(s.ti)+"</h2></div>";
    if(s.t===1){
      if(s.k)card.append(el("p","key",h(s.k)));
      if(s.im&&s.pos==="key")card.append(imgs(s.im));
      card.insertAdjacentHTML("beforeend",listHtml(s.b,s.bi));
      if(s.im&&s.pos==="body")card.append(imgs(s.im));
    }else if(s.t===2){
      const g=el("div","g"),tx=el("div","txt");
      tx.append(el("p","key",h(s.k)));tx.insertAdjacentHTML("beforeend",listHtml(s.b,s.bi));
      if(s.note)tx.append(el("p","note",esc(s.note)));
      g.append(imgs(s.im),tx);card.append(g);
    }else if(s.t===3){
      card.append(el("p","key",h(s.k)));
      const f=el("div","flow"+(s.big?" big":""));
      s.st.forEach((x,j)=>{if(j&&!s.na)f.append(el("div","ar"));f.append(el("div","st",(s.si&&s.si[j]?ico(s.si[j]):"")+(s.nm?'<span class="cn">'+String(j+1).padStart(2,"0")+"</span>":"")+"<span>"+h(x)+"</span>"))});
      card.append(f);
    }else if(s.t===5)quiz(s,i,card);
    else if(s.t===6)cloze(s,i,card);
    else if(s.t===7)free(s,i,card);
    else if(s.t===8)sim(s,i,card);
    else if(s.t===9)btns(s,card);
  }
  stage.replaceChildren(card);stage.scrollTop=0;
}
function quiz(s,i,card){
  card.append(el("p","key",h(s.q)));
  const box=el("div"),fb=el("div","fb");
  s.ch.forEach((c,j)=>{
    const b=el("button","opt",h(c));
    if(done[i]&&j===s.a)b.classList.add("ok");
    b.onclick=()=>{
      if(done[i])return;
      if(j===s.a){done[i]=1;b.classList.add("ok");cut("ok","正解！","<b>解説</b>　"+h(s.ex),1);fb.innerHTML="<b>解説</b>　"+h(s.ex);upd()}
      else{b.classList.add("ng");b.disabled=true;fb.innerHTML="<b>ヒント</b>　"+h(s.hint)}
    };
    box.append(b);
  });
  if(done[i])fb.innerHTML="<b>解説</b>　"+h(s.ex);
  card.append(box,fb);
}
function cloze(s,i,card){
  card.append(el("p","key",h(s.q)));
  const p=el("p","cz"),ins=[];
  s.tx.split("{}").forEach((t,j,a)=>{
    p.append(document.createTextNode(t));
    if(j<a.length-1){const x=el("input");x.type="text";x.maxLength=30;x.placeholder="？";x.autocomplete="off";x.setAttribute("aria-label","空欄"+(j+1));x.value=(st[i]||[])[j]||"";x.disabled=!!done[i];ins.push(x);p.append(x)}
  });
  const b=el("button","go","答え合わせ"),fb=el("div","fb");
  if(done[i]){b.disabled=true;fb.innerHTML=res[i]}
  b.onclick=()=>{
    const v=ins.map(x=>x.value);st[i]=v;
    const k=v.filter((x,j)=>s.an[j].some(a=>norm(a)===norm(x))).length,r=k/s.an.length,vd=verdict(r);
    res[i]="<b>一致 "+k+" / "+s.an.length+"</b><br>答え："+s.an.map(a=>esc(a[0])).join("、")+"<br><b>解説</b>　"+h(s.ex);
    fb.innerHTML=res[i];done[i]=1;b.disabled=true;ins.forEach(x=>x.disabled=true);cut(vd[0],vd[1],res[i],1);upd();
  };
  card.append(p,b,fb);
}
function free(s,i,card){
  card.append(el("p","key",h(s.q)));
  const t=el("textarea");t.maxLength=600;t.value=st[i]||"";t.disabled=!!done[i];t.setAttribute("aria-label","回答");
  const b=el("button","go","答え合わせ"),fb=el("div","fb");
  if(done[i]){b.disabled=true;fb.innerHTML=res[i]}
  b.onclick=()=>{
    const v=t.value;if(!v.trim()){fb.textContent="回答を入力してください。";return}
    st[i]=v;const k=s.kw.filter(g=>g.some(w=>norm(v).includes(norm(w)))).length,r=k/s.kw.length,vd=verdict(r);
    res[i]="<b>一致キーワード "+k+" / "+s.kw.length+"</b><br><b>模範解答</b>　"+h(s.model)+"<br>"+esc(s.ex);
    fb.innerHTML=res[i];done[i]=1;b.disabled=true;t.disabled=true;cut(vd[0],vd[1],res[i],1);upd();
  };
  card.append(t,b,fb);
}
function sim(s,i,card){
  const c=SIM[s.n],box=el("div","case");
  box.append(el("div","ct",esc(c.t)));
  c.c.forEach(x=>box.append(el("div","",esc(x))));
  card.append(box,el("div","lb2",esc(c.q)));
  const t=el("textarea");t.maxLength=800;t.value=simv[s.n];t.setAttribute("aria-label",c.q);
  done[i]=!!simv[s.n].trim();
  t.oninput=()=>{simv[s.n]=t.value;done[i]=!!t.value.trim();upd()};
  card.append(t);
}
function btns(s,card){
  card.append(el("p","key",h(s.k)));
  const r=el("div","pbs");
  s.bt.forEach(x=>{const b=el("button","pb",ico(x.ic)+"<span>"+esc(x.l)+"</span>");b.onclick=()=>pop(x.tt||x.l,x.ex);r.append(b)});
  card.append(r);
  if(s.im)card.append(imgs(s.im));
  if(s.note)card.append(el("p","note",esc(s.note)));
}
function summary(card){
  const w=el("div","sm");
  w.append(el("p","key","あなたの入力内容"));
  SIM.forEach((c,j)=>{
    w.append(el("div","lb2",esc("シミュレーション "+(j+1)+" / 4　"+c.q)));
    const cs=el("p","cs");cs.textContent="【"+c.t+"】\n"+c.c.join("\n");w.append(cs);
    const p=el("p","sv");p.textContent=simv[j].trim()||"（未記入）";w.append(p);
  });
  const cp=el("button","go","全記入内容をコピー"),m=el("span","note","");
  cp.onclick=()=>{
    const txt="【総合シミュレーション】\n\n"+SIM.map((c,j)=>"■シミュレーション "+(j+1)+" / 4\n【"+c.t+"】\n"+c.c.join("\n")+"\n"+c.q+"\n回答：\n"+(simv[j].trim()||"（未記入）")).join("\n\n");
    const ok=()=>{m.textContent="　コピーしました"};
    const fb=()=>{const a=document.createElement("textarea");a.value=txt;document.body.append(a);a.select();try{document.execCommand("copy");ok()}catch(e){m.textContent="　コピーに失敗しました"}a.remove()};
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fb);else fb();
  };
  w.append(cp,m);card.append(w);
}

/* ===== ナビ ===== */
const prev=$("#prev"),next=$("#next");
const locked=()=>[5,6,7,8].includes(S[cur].t)&&!done[cur];
function upd(){
  prev.disabled=cur===0;next.disabled=cur===N||locked();
  next.textContent=cur===0?"スタート":"次へ";
  $("#fill").style.width=(cur/N*100)+"%";
  $("#cnt").textContent=cur+" / "+N;
}
function go(n,jump){
  if(busy||n<0||n>N||n===cur)return;
  if(!jump&&n>cur&&locked())return;
  const chg=S[n].c!==S[cur].c;cur=n;render(cur);upd();
  if(chg)chapter(S[cur].c);
}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeLb();{const c=$("#cut");if(!c.dataset.lock)c.classList.remove("on")}$("#menu").classList.remove("open");return}
  if(/INPUT|TEXTAREA/.test((e.target||{}).tagName))return;
  if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);
});

/* ===== Chapter演出・目次 ===== */
function lasers(cls){
  const d=el("div","ls "+cls);
  for(let i=0;i<22;i++){const z=el("div","lz"),w=20+Math.random()*30;
    z.style.top=(Math.random()*100)+"%";z.style.width=w+"%";z.style.animationDelay=(-Math.random()*1)+"s";z.style.animationDuration=(0.35+Math.random()*0.5)+"s";d.append(z)}
  return d;
}
function chapter(c){
  busy=true;const o=$("#chap");
  o.replaceChildren(lasers("t"),el("div","c1","Chapter 0"+c),el("div","c2",esc(CH[c])),lasers("b"));
  o.classList.add("on");
  setTimeout(()=>{o.classList.remove("on");busy=false},1500);
}
const menu=$("#menu");
$("#menuBtn").onclick=e=>{
  e.stopPropagation();
  if(menu.classList.toggle("open")){
    menu.replaceChildren();
    CH.forEach((n,c)=>{
      const b=el("button","cb",'<span class="cn">Chapter 0'+c+"</span><span>"+esc(n)+"</span>");
      b.style.animationDelay=(c*0.08)+"s";
      b.onclick=ev=>{
        ev.stopPropagation();menu.classList.remove("open");
        const f=$("#flash");f.classList.remove("on");void f.offsetWidth;f.classList.add("on");
        go(S.findIndex(x=>x.c===c),true);
      };
      menu.append(b);
    });
  }
};
document.addEventListener("click",e=>{if(e.target===menu||!menu.contains(e.target))menu.classList.remove("open")});

/* ===== 全画面 ===== */
const fs=$("#fsBtn"),root=document.documentElement;
if(!root.requestFullscreen)fs.style.display="none";
fs.onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else root.requestFullscreen().catch(()=>{})};

/* ===== 背景の電撃 ===== */
(function(){
  const cv=$("#bg"),cx=cv.getContext("2d");let W,H,bolts=[];
  const rs=()=>{const d=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)};
  rs();addEventListener("resize",rs);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function spawn(){
    let x=Math.random()*W,y=Math.random()*H,a=Math.random()*Math.PI*2;const pts=[[x,y]],n=6+Math.floor(Math.random()*8);
    for(let i=0;i<n;i++){a+=(Math.random()-.5)*1.4;const l=20+Math.random()*50;x+=Math.cos(a)*l;y+=Math.sin(a)*l;pts.push([x,y])}
    bolts.push({p:pts,t:0,life:350+Math.random()*450,c:Math.random()<.5?"#ffe600":"#3a5bff",w:Math.random()<.2?2:1});
  }
  let last=performance.now(),acc=0;
  function loop(now){
    const dt=now-last;last=now;acc+=dt;
    while(acc>(reduce?600:110)){acc-=(reduce?600:110);if(bolts.length<26)spawn()}
    cx.clearRect(0,0,W,H);cx.lineJoin="round";
    bolts=bolts.filter(b=>(b.t+=dt)<b.life);
    bolts.forEach(b=>{
      const a=1-b.t/b.life;cx.globalAlpha=a*(Math.random()<.2?.4:.9);cx.strokeStyle=b.c;cx.shadowColor=b.c;cx.shadowBlur=10;cx.lineWidth=b.w;
      cx.beginPath();b.p.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.stroke();
    });
    cx.globalAlpha=1;requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

render(0);upd();
</script>
