<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熱傷についての復習</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --bg-dark: #070a14;
  --card-bg: rgba(22, 14, 42, 0.94);
  --text-main: #f0f4f8;
  --text-muted: #a0aec0;
  --accent-cyan: #00f0ff;
  --accent-purple: #e024ff;
  --accent-gold: #ffd700;
  --accent-red: #ff3b30;
  --accent-green: #34c759;
  box-sizing: border-box;
}


* { box-sizing: border-box; }


html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: "游ゴシック体", "Yu Gothic", YuGothic, "ヒラギノ角ゴ Pro W3", "Hiragino Kaku Gothic Pro", "メイリオ", Meiryo, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  user-select: none;
}


/* Background Ember Canvas */
#emberCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  z-index: 1;
  pointer-events: none;
}


/* Top Progress Bar */
#bar {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  height: 5px;
  width: 0%;
  background: linear-gradient(90deg, #00f0ff, #ff00ff, #ff5500);
  background-size: 200% 100%;
  animation: flowBar 3s linear infinite;
  z-index: 10;
  transition: width 0.4s ease-out;
}


@keyframes flowBar {
  0% { background-position: 0% 0; }
  100% { background-position: 200% 0; }
}


/* Animated Highlight Text */
.hl {
  background: linear-gradient(90deg, #ff8800, #ff007f, #ffea00, #ff8800);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: flowText 4s linear infinite;
  font-weight: bold;
}


@keyframes flowText {
  0% { background-position: 0% 0; }
  100% { background-position: 300% 0; }
}


/* App Container */
#app {
  position: relative;
  z-index: 5;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 12px 10px 10px;
}


/* Outer Gradient Border Wrap - Responsive Auto Height */
.card-border-wrap {
  position: relative;
  width: min(95vw, 1100px);
  max-height: calc(100vh - 124px);
  max-height: calc(100dvh - 124px - env(safe-area-inset-bottom, 0px));
  border-radius: 24px;
  padding: 3px;
  background: linear-gradient(115deg, #8a2be2, #ff0055, #ffea00, #00f0ff, #8a2be2);
  background-size: 300% 300%;
  animation: borderGlow 6s ease infinite;
  box-shadow: 0 0 25px rgba(138, 43, 226, 0.4), 0 0 50px rgba(255, 0, 85, 0.2);
  margin-top: 36px;
  display: flex;
  flex-direction: column;
}


@keyframes borderGlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}


/* Inner Glass Card - Fully Scrollable */
.card {
  display: none;
  width: 100%;
  max-height: calc(100vh - 130px);
  max-height: calc(100dvh - 130px - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  padding: clamp(20px, 3.8vw, 36px);
  border-radius: 21px;
  background: var(--card-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}


.card.on {
  display: flex;
  flex-direction: column;
}


/* Sequential Fade-in Animations for Card Elements */
.card.on .title-card > * {
  animation: fadeInUp 0.4s ease forwards;
}


.card.on .card-header {
  animation: fadeInUp 0.35s ease 0.05s forwards;
  opacity: 0;
}


.card.on .key-msg {
  animation: fadeInUp 0.35s ease 0.12s forwards;
  opacity: 0;
}


.card.on .card-content {
  animation: fadeInUp 0.35s ease 0.18s forwards;
  opacity: 0;
}


.card.on .tool-box {
  animation: fadeInUp 0.35s ease 0.24s forwards;
  opacity: 0;
}


.card.on .note-box {
  animation: fadeInUp 0.35s ease 0.3s forwards;
  opacity: 0;
}


@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}


.card-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
  border-bottom: 2px solid rgba(255, 255, 255, 0.12);
  padding-bottom: 12px;
  flex-shrink: 0;
}


.card-icon {
  width: 58px;
  height: 58px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.2);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}


.card-icon svg {
  width: 32px;
  height: 32px;
  stroke: #ff4de0;
}


.card-title-group h2 {
  margin: 0;
  font-size: clamp(22px, 4.5vw, 32px);
  letter-spacing: 0.5px;
  line-height: 1.3;
}


.card-title-group .chapter-badge {
  font-size: 13px;
  color: var(--accent-gold);
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}


.card-content {
  font-size: clamp(17px, 3.8vw, 22px);
  line-height: 1.75;
  flex-grow: 1;
}


.card-content ul {
  margin: 10px 0;
  padding-left: 1.2em;
}


.card-content li {
  margin: 8px 0;
}


.key-msg {
  background: rgba(60, 20, 110, 0.7);
  border-left: 5px solid #ff4de0;
  padding: 12px 18px;
  border-radius: 0 12px 12px 0;
  margin: 10px 0 16px;
  font-weight: bold;
  font-size: clamp(18px, 4vw, 24px);
  line-height: 1.5;
}


.diagram-box {
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(0, 240, 255, 0.3);
  border-radius: 16px;
  padding: 16px;
  margin: 14px 0;
}


.depth-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px;
}


.depth-card {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  padding: 12px;
  border-top: 4px solid var(--accent-cyan);
}


.depth-card.d1 { border-color: #ff9500; }
.depth-card.d2s { border-color: #ff2d55; }
.depth-card.d2d { border-color: #af52de; }
.depth-card.d3 { border-color: #007aff; }


.depth-card h4 { margin: 0 0 6px; font-size: 17px; }
.depth-card p { margin: 0; font-size: 13.5px; color: var(--text-muted); }


/* Navigation Bar */
nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 10;
  padding-bottom: 4px;
  padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));
  flex-shrink: 0;
}


.nb {
  border: 0;
  border-radius: 999px;
  padding: 12px 30px;
  font-size: 17px;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(90deg, #00f0ff, #ff00cc, #00f0ff);
  background-size: 200% 100%;
  animation: nbFlow 3s linear infinite;
  cursor: pointer;
  box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
  transition: transform 0.2s, opacity 0.2s;
}


@keyframes nbFlow {
  0% { background-position: 0% 0; }
  100% { background-position: 200% 0; }
}


.nb:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 0 22px rgba(255, 0, 204, 0.6);
}


.nb:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  box-shadow: none;
}


#cnt {
  color: var(--text-muted);
  font-size: 17px;
  font-weight: bold;
  min-width: 80px;
  text-align: center;
}


/* Header Action Buttons */
#tocBtn, #fsBtn {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  z-index: 10;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: var(--card-bg);
  color: var(--text-main);
  cursor: pointer;
  display: grid;
  place-items: center;
  backdrop-filter: blur(8px);
}


#tocBtn { left: 14px; }
#fsBtn { right: 14px; }
#tocBtn svg, #fsBtn svg { width: 22px; height: 22px; stroke: var(--text-main); }


/* Table of Contents Modal */
#tocModal {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(7, 10, 20, 0.96);
  backdrop-filter: blur(20px);
  display: none;
  flex-direction: column;
  padding: 40px 20px;
  overflow-y: auto;
}


#tocModal.show { display: flex; }


.toc-header { display: flex; justify-content: space-between; align-items: center; max-width: 900px; width: 100%; margin: 0 auto 24px; }
.toc-header h2 { margin: 0; font-size: 28px; color: var(--accent-cyan); }
.close-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; }
.close-btn svg { width: 32px; height: 32px; stroke: #fff; }


.toc-list { display: flex; flex-direction: column; gap: 12px; max-width: 900px; width: 100%; margin: 0 auto; }
.toc-item { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: all 0.25s; }
#tocModal.show { animation: tocFade 0.3s ease-out; }
#tocModal.show .toc-item { animation: tocDrop 0.55s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 70ms + 80ms); }
@keyframes tocFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes tocDrop { from { opacity: 0; transform: translateY(-70px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
.toc-item:hover { background: rgba(0, 240, 255, 0.15); border-color: var(--accent-cyan); transform: translateX(6px); }
.toc-num { font-size: 18px; font-weight: 900; min-width: 100px; background: linear-gradient(90deg, #ff4de0, #a855f7, #ff4de0); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: tocNumFlow 3s linear infinite; }
@keyframes tocNumFlow { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
.toc-title { font-size: 18px; font-weight: 700; }


/* Quiz Buttons */
.opt {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: clamp(17px, 4vw, 22px);
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.05);
  border: 2px solid rgba(0, 240, 255, 0.35);
  border-radius: 14px;
  padding: 15px 20px;
  margin: 10px 0;
  cursor: pointer;
  transition: all 0.2s;
}


.opt:hover {
  background: rgba(0, 240, 255, 0.18);
  border-color: var(--accent-cyan);
}


/* Cut-in Quiz Result Overlay */
#ov {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  transition: opacity 0.4s ease;
  text-align: center;
}


#ov.show { display: flex; }
#ov.in { opacity: 1; }
#ov.ok { background: rgba(2, 6, 20, 0.95); }
#ov.ng { background: rgba(22, 2, 16, 0.95); }


#ovBox { max-width: 700px; width: 100%; }
#ovTitle { font-size: clamp(50px, 14vw, 110px); font-weight: 900; margin: 0 0 14px; animation: popCut 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.ok #ovTitle { color: var(--accent-cyan); text-shadow: 0 0 20px #00f0ff, 0 0 40px #00a2ff, 0 0 80px #0055ff; }
.ng #ovTitle { color: var(--accent-purple); text-shadow: 0 0 20px #e024ff, 0 0 40px #9000ff, 0 0 80px #ff0055; }


@keyframes popCut { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }


#ovDesc { font-size: clamp(18px, 4vw, 24px); line-height: 1.7; color: #f0f4f8; margin: 0 0 22px; white-space: pre-line; }
#ovBtn { border: 0; border-radius: 999px; padding: 14px 42px; font-size: 18px; font-weight: bold; color: #070a14; background: linear-gradient(90deg, #00f0ff, #ff00cc); cursor: pointer; box-shadow: 0 0 20px rgba(0, 240, 255, 0.5); }


#chIntro {
  position: fixed;
  inset: 0;
  z-index: 95;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  background: rgba(0, 0, 0, 0.97);
  overflow: hidden;
}
#chIntro.show { display: flex; animation: chIntroAnim 1.5s ease forwards; }
@keyframes chIntroAnim { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
#chNum, #chTitle {
  margin: 0;
  font-weight: 900;
  color: #ff4de0;
  text-shadow: 0 0 20px #ff00cc, 0 0 40px #ff00aa, 0 0 80px #ff0080;
}
#chNum { font-size: clamp(54px, 15vw, 130px); animation: popCut 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
#chTitle { font-size: clamp(24px, 6vw, 48px); margin-top: 14px; line-height: 1.4; }
.laser { position: absolute; left: 0; width: 100%; height: 4px; overflow: hidden; background: rgba(255, 0, 48, 0.25); }
.laser.top { top: 0; }
.laser.bottom { bottom: 0; }
.laser::before {
  content: "";
  position: absolute;
  top: 0;
  height: 100%;
  width: 35%;
  background: linear-gradient(90deg, rgba(255, 0, 48, 0), #ff1030 40%, #ffffff 50%, #ff1030 60%, rgba(255, 0, 48, 0));
  box-shadow: 0 0 14px 4px #ff0030, 0 0 30px 8px rgba(255, 0, 48, 0.6);
}
.laser.top::before { animation: laserRight 0.7s linear infinite; }
.laser.bottom::before { animation: laserLeft 0.7s linear infinite; }
@keyframes laserRight { from { left: -35%; } to { left: 100%; } }
@keyframes laserLeft { from { left: 100%; } to { left: -35%; } }


#imgZoom {
  position: fixed;
  inset: 0;
  z-index: 92;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 0, 0, 0.93);
}
#imgZoom.show { display: flex; animation: zoomFade 0.25s ease-out; }
@keyframes zoomFade { from { opacity: 0; } to { opacity: 1; } }
.zoom-frame {
  padding: 5px;
  border-radius: 20px;
  background: linear-gradient(90deg, #ff4de0, #3b82ff, #ff4de0);
  background-size: 200% 100%;
  animation: zoomBorder 2.5s linear infinite;
  box-shadow: 0 0 24px rgba(255, 77, 224, 0.5), 0 0 40px rgba(59, 130, 255, 0.4);
  line-height: 0;
}
@keyframes zoomBorder { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
#imgZoomImg { display: block; max-width: calc(100vw - 52px); max-height: calc(100vh - 52px); max-width: calc(100vw - 52px); max-height: calc(100dvh - 52px); border-radius: 15px; }
#imgZoomClose { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; }


#jumpFlash {
  position: fixed;
  inset: 0;
  z-index: 60;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(circle at center, rgba(255, 106, 0, 0.3), rgba(255, 106, 0, 0) 70%);
  box-shadow: inset 0 0 140px 50px #ff6a00, inset 0 0 50px 12px #ffa040;
}
#jumpFlash.go { animation: orangeFlash 0.9s ease-out; }
@keyframes orangeFlash { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }


#starCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 101; pointer-events: none; }


/* Interactive Tools & Gimmicks */
.tool-box {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 18px;
  padding: 18px;
  margin-top: 12px;
}


.tool-res {
  margin-top: 14px;
  padding: 14px;
  border-radius: 12px;
  background: rgba(0, 240, 255, 0.12);
  border: 1px solid var(--accent-cyan);
  font-size: 19px;
  font-weight: bold;
  text-align: center;
}


.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 16px; margin-bottom: 6px; color: var(--accent-gold); }
.form-control { width: 100%; padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 16px; }
.form-control:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }


/* Mannequin Interactive Gimmick 4 Styling */
.mannequin-container {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  justify-content: center;
  margin: 12px 0;
}


.mannequin-svg {
  width: min(220px, 70vw);
  height: auto;
  background: rgba(0,0,0,0.5);
  border-radius: 16px;
  padding: 8px;
  border: 1px solid rgba(0, 240, 255, 0.3);
}


.part-burn { transition: all 0.3s; cursor: pointer; }
.part-burn.d0 { fill: #3a4a5e; stroke: #5a6a7e; }
.part-burn.d1 { fill: #ff9500; stroke: #ffaa33; }
.part-burn.d2 { fill: #ff2d55; stroke: #ff5577; }
.part-burn.d3 { fill: #af52de; stroke: #cc66ff; }


.mannequin-legend {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: rgba(0,0,0,0.3);
  padding: 14px;
  border-radius: 12px;
  min-width: 200px;
}


.legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.legend-color { width: 18px; height: 18px; border-radius: 4px; }


.tool-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  padding: 10px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  text-align: center;
  transition: all 0.2s;
}


.tool-btn.active {
  background: rgba(0, 240, 255, 0.25);
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
  font-weight: bold;
}


.checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
.checkbox-item { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 15px; }
.checkbox-item input { width: 18px; height: 18px; accent-color: var(--accent-cyan); }


/* Title Slide Layout */
.title-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px 10px;
}


.title-card h1 { font-size: clamp(30px, 5.5vw, 48px); margin: 16px 0; line-height: 1.25; }
.title-card p { font-size: clamp(17px, 3.5vw, 22px); color: var(--text-muted); max-width: 780px; margin-bottom: 28px; }
.start-btn { background: linear-gradient(90deg, #00f0ff, #ff00cc); color: #070a14; font-weight: 900; font-size: clamp(19px, 4vw, 26px); padding: 16px 48px; border-radius: 999px; border: none; cursor: pointer; box-shadow: 0 0 28px rgba(0, 240, 255, 0.6); transition: transform 0.2s; }
.start-btn:hover { transform: scale(1.05); }


.copy-btn { background: linear-gradient(90deg, #ffd700, #ff8800); color: #000; font-weight: bold; border: none; padding: 14px 32px; border-radius: 999px; cursor: pointer; font-size: 18px; margin-top: 14px; box-shadow: 0 0 18px rgba(255, 215, 0, 0.5); }
.copy-btn:hover { transform: scale(1.03); }


.slide-img { display: block; max-width: 100%; max-height: 40vh; max-height: 40dvh; width: auto; height: auto; margin: 12px auto; border-radius: 14px;  cursor: zoom-in;}


.card-content ul.cause-list { list-style: none; padding-left: 0; margin: 10px 0; }
.cause-item { display: flex; align-items: center; gap: 14px; margin: 14px 0; font-size: clamp(19px, 4.2vw, 26px); }
.cause-icon { width: 46px; height: 46px; border-radius: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); display: grid; place-items: center; flex-shrink: 0; }
.cause-icon svg { width: 26px; height: 26px; stroke: #a855f7;}


.note-box { font-size: 13.5px; color: var(--text-muted); margin-top: 16px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.15); }


/* ===== 追加：スライド15 カットイン問題（自由記述） ===== */
#qov {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  transition: opacity 0.5s ease;
  text-align: center;
  background: rgba(0, 0, 0, 0.97);
}
#qov.show { display: flex; }
#qov.in { opacity: 1; }
#qBox { max-width: 720px; width: 100%; }
#qTitle {
  font-size: clamp(40px, 11vw, 84px);
  font-weight: 900;
  margin: 0 0 14px;

  { img: "i9471", imgPos: "body", ch: 2, icon: "thermometer", t: "疫学と受傷機転", km: "皮膚は70℃以上で「約1秒」<p>60℃で「約10秒」で熱傷を生じる</p>", c: `<ul><li>小児では<span class="hl">高温液体（熱湯・ミルクなど）</span>による受傷が多い。</li><li><span class="hl">低温</span>であっても<span class="hl">長時間暴露</span>されると熱傷を生じる可能性がある。</li><li>乳幼児や高齢者は<span class="hl">皮膚が薄い</span>ため、熱傷を生じるまでの時間は短くなる。</li><li>熱傷が<span class="hl">広範囲</span>の場合、<span class="hl">深度が深い</span>場合、局所の炎症反応だけでなく<span class="hl">全身性炎症反応</span>が引き起こされ、ショック、DIC、多臓器不全などの全身症状を引き起こす。</li></ul>` },
  { ch: 2, icon: "alert", t: "熱傷が引き起こす全身の危機", km: "本地域では「10%」がキーワード！", c: `<ul><li>プロトコル：<span class="hl">10%未満 → 局所冷却</span> / <span class="hl">10%以上 → 全身保温</span>。</li><li>一定以上の広さと深さを持つ熱傷は、数時間単位で全身循環不全をもたらします。</li></ul>` },
  { img: "i9472", imgPos: "km", ch: 3, icon: "layers", t: "熱傷深達度の３段階分類", km: "損傷が届く深度によってⅠ度・Ⅱ度（浅達・深達）・Ⅲ度に分かれる", c: `<p>深達度：</p><div class="depth-grid"><div class="depth-card d1"><h4>Ⅰ度（表層）</h4><p>表皮のみ。発赤・ヒリヒリ感。水疱なし。治癒痕なし。<br></p></div><div class="depth-card d2s"><h4>Ⅱ度浅達（SDB）</h4><p>真皮浅層。鮮紅色水疱・激痛。1〜2週で治癒。<br></p></div><div class="depth-card d2d"><h4>Ⅱ度深達（DDB）</h4><p>真皮深層。破れやすい水疱・痛覚鈍麻・まだら状。<br></p></div><div class="depth-card d3"><h4>Ⅲ度（全層）</h4><p>皮膚全層壊死。羊皮紙様白色・炭化・<b>無痛</b>。<br></p></div></div>` },
  { img: "i9473", imgPos: "km", ch: 3, icon: "sun", t: "Ⅰ度熱傷（表層熱傷）", km: "表皮のみの損傷。日焼けのような発赤とヒリヒリした強い痛みが特徴", c: `<ul><li>水疱は形成されず、痕を残さず<span class="hl">自然治癒</span>します。</li><li><span class="hl">【超重要！】全身体表面積（TBSA）の計算からは除外</span>して評価します。</li></ul>` },
  { img: "i9474", imgPos: "km", ch: 3, icon: "droplet", t: "Ⅱ度浅達性熱傷（SDB）", km: "キーワードは”水疱”：真皮浅層の損傷で鮮紅色の水疱と激しい痛みを伴う", c: `<ul><li><span class="hl">水泡</span>を認め、皮膚は赤く湿潤しており、痛覚神経が刺激され<span class="hl">強い痛み</span>があります。</li><li>約1〜2週間で再上皮化します。TBSA計算に含めます。</li></ul>` },
  { img: "i9511", imgPos: "km", ch: 3, icon: "skin", t: "Ⅱ度深達性熱傷（DDB）", km: "キーワードは”皮膚剥離”：水疱底はまだら模様で痛みが鈍麻する", c: `<ul><li>水疱が破れやすく<span class="hl">皮膚剥離</span>を認めます。神経末端損傷のため<span class="hl">痛みが鈍い</span>。</li><li>瘢痕を残しやすく、TBSA計算に含めます。</li></ul>` },
  { img: "i9475", imgPos: "km", ch: 3, icon: "burn", t: "Ⅲ度熱傷（全層熱傷）", km: "皮下組織まで及ぶ熱傷。白色乾燥または炭化を呈する", c: `<ul><li>表皮→皮下組織まで破壊され、受傷面は<span class="hl">硬化・乾燥</span>。</li><li>自律的再上皮化は望めず、<span class="hl">植皮手術が必須</span>となります。</li></ul>` },
  { img: "i9476", imgPos: "body", ch: 3, icon: "shield", t: "現場で見分けるピットフォール", km: "「痛くない」＝熱傷なしではない。衣服の内側はⅢ度熱傷かも", c: `<ul><li>Ⅲ度熱傷は、痛覚神経自体が破壊・消失しているため、<span class="hl">傷病者は痛みを訴えません</span>！</li><li><span class="hl">服</span>や<span class="hl">靴</span>の内側は、Ⅲ度熱傷の可能性を考えましょう。</li></ul>` },
  { ch: 3, icon: "scissors", t: "張り付いた衣服", km: "焼けて張り付いた衣服や皮膚への固着部分は無理に除去しない！", c: `<ul><li><span class="hl">無理な脱衣</span>は創面を広げ<span class="hl">皮膚剥離を悪化</span>させます。可能な範囲での除去を。</li></ul>` },
  { ch: 3, quiz: true, icon: "badge", t: "第3章 確認クイズ：深達度の識別", q: "熱傷深達度の評価で「現場活動において誤っている対応」はどれですか？", o: ["Ⅰ度熱傷（日焼け様の発赤）はTBSAの計算から除外する", "痛みを感じていない部位は軽症と判断し、観察を後回しにする", "皮膚に固着した衣類は剥がさず、可能な範囲で除去する"], a: 1, e: "痛みが消失している部位は痛覚神経まで破壊された「Ⅲ度熱傷」の可能性が高く、非常に重症です！痛がり方だけで軽症と判断してはいけません。", h: "痛覚神経が死滅すると痛みが無くなります。「痛くない＝軽症」ではありません！" },
  { ch: 4, icon: "calc", t: "熱傷面積（TBSA）算出の重要性", km: "正確な受傷面積（TBSA）把握 → 介入・医療機関選定の根拠", c: `<ul><li><span class="hl">TBSA ＝ Ⅰ度を除いた「Ⅱ度 ＋ Ⅲ度」の合計面積</span>で算出。</li><li><span class="hl">生理学的所見と併せて</span>、緊急度・重症度の判断、保温や輸液などの判断材料になります！</li></ul>` },
  { img: "i9505", imgPos: "km",ch: 4, cutinQ: true, icon: "grid", t: "広範囲の評価「9の法則」", km: "成人：<p>頭部9%</p><p>上肢各9%</p><p>体幹腹側18%</p><p>体幹背側18%</p><p>下肢（大腿・下腿）各９%</p><p>会陰1%", c: `<ul><li>広範囲熱傷の場合、部位ごとの9%単位で迅速に暗算評価します。</li></ul>` },
  { ch: 4, icon: "child", t: "小児の評価「5の法則」", km: "小児は頭部が大きく下肢が小さいため、9の法則ではなく「5の法則」で評価する", c: `<ul><li>成人の9の法則をそのまま使うと誤差が大きくなるため、小児は<span class="hl">5の法則</span>を用います。</li></ul><div class="depth-grid"><div class="depth-card d1"><h4>頭部</h4><p><b>20%</b></p></div><div class="depth-card d2s"><h4>体幹</h4><p>前面 <b>20%</b> ／ 後面 <b>20%</b></p></div><div class="depth-card d2d"><h4>上肢</h4><p>各 <b>10%</b></p></div><div class="depth-card d3"><h4>下肢</h4><p>各 <b>10%</b></p></div></div><p style="margin:10px 0 0;">合計 100%（20＋40＋20＋20）</p>` },
  { ch: 4, icon: "hand", t: "局所の評価「手掌法」", km: "「傷病者の手のひら全体」＝ 1%として計算", c: `<ul><li>隊員の手ではなく、<span class="hl">「傷病者本人の手のひら」</span>を1%基準とします。</li></ul>` },
  { ch: 4, gimmick: "mannequin", icon: "calc", t: "第4章 ギミック：3Dマネキン TBSA評価実技トレーニング", km: "3Dマネキンにランダム出現する熱傷深達度（1度・2度・3度）を見極め、正しいTBSA%を算出せよ！", c: `<div class="tool-box"><p style="margin:0 0 8px; font-weight:bold; color:var(--accent-cyan);">※【1度熱傷はTBSA除外・2度と3度は計算対象】スワイプで回転して前面・背面を確認してください（正解しないと次に進めません）</p><div class="mode-row"><button class="tool-btn active" id="modeAdultBtn" onclick="setBurnMode('adult')">成人モード（9の法則）</button><button class="tool-btn" id="modeChildBtn" onclick="setBurnMode('child')">小児モード（5の法則）</button></div><div class="burn3d-wrap"><div id="burn3dBox" class="burn3d-box"></div><div class="burn3d-hint">スワイプで回転 ↔</div></div><div class="legend-row"><div class="legend-item"><div class="legend-color" style="background:#f5d0b4;"></div>正常</div><div class="legend-item"><div class="legend-color" style="background:#ff99bb;"></div>1度（TBSA<b>除外</b>）</div><div class="legend-item"><div class="legend-color" style="background:#ff1e3c; border:1px solid cyan; border-radius:50%;"></div>2度（水疱）</div><div class="legend-item"><div class="legend-color" style="background:#222; border:1px solid #fff;"></div>3度</div></div><button class="tool-btn active" onclick="generateRandomBurnScenario()">症例をランダム生成</button><div class="form-group" style="margin-top:14px;"><label>この症例の正しいTBSA (全身体表面積 %) を入力:</label><div style="display:flex; gap:10px;"><input type="number" id="userTbsaInput" class="form-control" step="0.5" inputmode="decimal" placeholder="数字のみ入力 (例: 27)" style="font-size:18px; font-weight:bold;"><button class="tool-btn active" style="min-width:120px; font-size:17px;" onclick="verifyTbsaAnswer()">解答判定</button></div></div><div class="tool-res" id="tbsaEvalResult">「症例をランダム生成」または数値を入力して判定してください</div></div>` },
  { ch: 5, icon: "cross", t: "【参考】緊急度・重症尾判定：Ⅱ度", km: "「重症熱傷」＝ 成人TBSAⅡ度20%以上、小児・高齢者 Ⅱ度10%以上！", c: `<ul><li>小児・高齢者は生理的予備能力が低いため成人の半分の面積で重症となります。</li><li>全身管理と厳重な保温が必須です。</li><li>※<span class="hl">広範囲熱傷とは通常30％TBSA以上</span>の熱傷を指す</li></ul></ul>` },
  { ch: 5, icon: "burn", t: "【参考】緊急度・重症尾判定：Ⅲ度", km: "「重症熱傷（Ⅲ度）」＝成人Ⅲ度10%以上、小児・高齢者Ⅲ度5%以上", c: `<ul><li>Ⅲ度熱傷は自力での再上皮化が望めず、<span class="hl">植皮手術が必要</span>となります。</li><li><span class="hl">成人：Ⅲ度TBSA 10%以上</span></li><li><span class="hl">小児・高齢者：Ⅲ度TBSA 5%以上</span></li><li>TBSAの算出では、Ⅱ度に加えてⅢ度の面積も必ず評価します。</li></ul>` },
  { ch: 5, icon: "alert", t: "面積に関わらず重症とみなす場合", km: "特殊機序や、特定の部位は面積が小さくても「重症」！", c: `<ul><li>面積数値だけで判断せず<span class="hl">「受傷部位や受傷機転」からも評価</span>します。</li><li>特殊機序：<span class="hl">化学熱傷・電（雷）撃傷</span></li><li>部位：<span class="hl">気道熱傷・顔・首・手・足・陰部・関節</span>の熱傷</li><li>他の外傷を合併する熱傷</li></ul>` },
  {  img: "i9513", imgPos: "km",ch: 5, icon: "face", t: "危険部位①「顔面・頸部」", km: "急速な上気道浮腫による「気道閉塞（Aの異常）」のリスク！", c: `<ul><li>組織が疎であり浮腫進行が非常に早いため、搬送途上で窒息する危険があります。</li></ul>` },
  {  img: "i9507", imgPos: "km",ch: 5, icon: "bone", t: "危険部位②「手足・関節部」", km: "将来的な瘢痕拘縮とADL障害に直結する部位", c: `<ul><li>救命後を見据えた専門的皮膚・創傷管理が必要なため、高度医療施設へ引き継ぎます。</li></ul>` },
  {  img: "i9509", imgPos: "km",ch: 5, icon: "biohazard", t: "危険部位③「会陰部」", km: "排泄物（常在菌）による激しい重篤感染・敗血症リスク！", c: `<ul><li>見落としやすいため全身観察（E）の際に必ず確認します。</li></ul>` },
  { img: "i9508", imgPos: "body", ch: 5, icon: "alert", t: "全周性の熱傷", km: "四肢の「全周性」Ⅲ度熱傷は、止血帯のように作用し、患肢の循環が停止する！", c: `<ul><li>Ⅲ度熱傷は伸縮しない硬い焼痂を形成する。</li><li><span class="hl">すべての四肢の熱傷では定期的に末梢の脈拍のチェックを行うべき。</span></li></ul>` },
  { ch: 5, quiz: true, icon: "badge", t: "第5章 クイズ1/3：成人緊急度・重症尾判定", q: "成人（15〜64歳）において、緊急度・重症尾判定Ⅱ度熱傷で、「重症」と判定されるTBSAのラインはどれですか？", o: ["TBSA 15%以上", "TBSA 20%以上", "TBSA 45%以上"], a: 1, e: "成人ではⅡ度20％、Ⅲ度10％以上で「重症熱傷」に分類されます。", h: "成人はⅡ度だけに〇0%以上" },
  { ch: 5, quiz: true, icon: "badge", t: "第5章 クイズ2/3：小児・高齢者緊急度・重症尾判定", q: "小児（15歳未満）または高齢者（65歳以上）で、Ⅱ度熱傷において「重症熱傷」とされるTBSA基準はどれですか？", o: ["TBSA 5%以上", "TBSA 10%以上", "TBSA 15%以上"], a: 1, e: "小児・高齢者は生理的予備能力が低く脱水・ショックに陥りやすいため、成人の半分の「TBSA 10%以上」で重症となります。", h: "成人の基準（20%）の「半分」が回答です。" },
  { ch: 5, quiz: true, icon: "badge", t: "第5章 クイズ3/3：一発重症の危険部位", q: "TBSAが5%と狭範囲であっても、即座に「三次医療機関選定（一発重症）」となる条件はどれですか？", o: ["前腕部のⅠ度熱傷のみ", "顔面・気道熱傷の疑い、または手足・主要関節部・会陰部の受傷", "背部の軽度な発赤"], a: 1, e: "気道閉塞リスク（顔面/気道）、機能障害リスク（関節/手足）、重篤感染リスク（会陰部）は面積に関わらず三次医療機関受入が必須です！", h: "窒息や感染、機能障害に直結する危険部位を選びましょう。" },
  { ch: 6, icon: "wind", t: "気道熱傷の恐怖", km: "喉頭浮腫と窒息は「時間差」で引き起こされる！", c: `<ul><li>接触直後は自発呼吸があっても、数時間かけて気道が狭窄・閉塞します。</li><li>救急隊が現場を離れた後にCPAへ至る危険を孕んでいます。</li></ul>` },
  { img: "i9513", imgPos: "km", ch: 6, icon: "siren", t: "気道熱傷の3大徴候", km: "口周りの熱傷、口腔内煤、嗄声・鼻毛焦げがあれば気道緊急！", c: `<ul><li>1つでも該当すれば即座に<span class="hl">高濃度酸素投与＋三次医療機関選定</span>。</li><li>いびき様呼吸や流涎（よだれ）が出現すればEmergency！</li></ul>` },
  { ch: 6, icon: "gas", t: "火災現場①「一酸化炭素（CO）中毒」", km: "SpO2は COヘモグロビンにより「偽高値（98〜100%）」を示す！", c: `<ul><li>パルスオキシメーターに騙されず、火災受傷全例で<span class="hl">高濃度酸素を投与</span>します。</li></ul>` },
  { ch: 6, icon: "skull", t: "火災現場②「シアン化水素中毒」", km: "【参考】酸素投与で改善しないなら、シアン中毒かも", c: `<ul><li>建材・プラスチック燃焼で発生。ミトコンドリアの細胞呼吸を阻害。</li><li>血液は<span class="hl">「静脈血も鮮紅色」</span>。早期の解毒剤投与が必要です。</li></ul>` },
  { ch: 6, quiz: true, icon: "alert", t: "第6章 ケーススタディクイズ：SpO2の罠", q: "火災現場から救出。鼻毛焦げあり、閉鎖空間受傷。バイタル測定でSpO2 99%を示しています。適切な介入は？", o: ["SpO2が99%で正常値のため、酸素投与は不要と判断する", "CO中毒の可能性を考慮し、SpO2表示に関わらず即座に高濃度酸素を投与する", "呼吸苦を訴えるまで部屋の空気で経過観察する"], a: 1, e: "パルスオキシメーターはCOヘモグロビンを酸素化ヘモグロビンと認識して99〜100%の『偽高値』を出します！外見上の値に騙されず即座に高濃度酸素投与を行ってください。", h: "一酸化炭素（CO）が結合するとSpO2メーターは『正常』と誤認します！" },

const chIntro = document.getElementById("chIntro");

function chapterOf(i) { return (SLIDES[i] && SLIDES[i].ch) || 0; }
function playChapterIntro(num) {
  const ch = CHAPTERS.find(c => c.num === num);
  if (!ch) return;
  document.getElementById("chNum").textContent = "Chapter " + num;
  document.getElementById("chTitle").textContent = ch.title;
  chIntro.classList.remove("show");
  void chIntro.offsetWidth;
  chIntro.classList.add("show");
  clearTimeout(chIntroTimer);
  chIntroTimer = setTimeout(() => chIntro.classList.remove("show"), 1500);
}


function showSlide(index) {
  const prevCh = chapterOf(currentSlide);
  currentSlide = Math.max(0, Math.min(totalSlides - 1, index));
  const allCards = document.querySelectorAll(".card");
  allCards.forEach((c, i) => {
    c.classList.toggle("on", i === currentSlide);
  });


  const newCh = chapterOf(currentSlide);
  if (newCh !== prevCh && newCh !== 0) playChapterIntro(newCh);


  const progressPercent = ((currentSlide + 1) / totalSlides) * 100;
  barDisplay.style.width = progressPercent + "%";
  cntDisplay.textContent = `${currentSlide + 1} / ${totalSlides}`;


  prevBtn.disabled = (currentSlide === 0);


  const targetSlideObj = SLIDES[currentSlide];
  if (targetSlideObj.quiz && !solvedQuizzes.has(currentSlide)) { nextBtn.disabled = true; }
  else if (targetSlideObj.gimmick === "mannequin" && !solvedQuizzes.has(currentSlide)) { nextBtn.disabled = true; }
  else { nextBtn.disabled = (currentSlide === totalSlides - 1); }


  if (targetSlideObj.gimmick === "mannequin") {
    initBurn3d();
    resizeBurn3d();
    startBurn3d();
    if (mannequinScenario.correctTbsa === 0 && burnReady) { generateRandomBurnScenario(); }
  } else {
    stopBurn3d();
  }
}


function jumpToSlide(index) { showSlide(index); }


nextBtn.onclick = () => {
  const curObj = SLIDES[currentSlide];
  if (curObj.isEmuStep) {
    const textarea = document.getElementById(`emu${curObj.emuStepNum}_input`);

  if (curObj.cutinQ && !solvedQuizzes.has(currentSlide)) { openQuestion(); return; }
  showSlide(currentSlide + 1);
};

});

function checkQuiz(slideIdx, optionIdx) {
  const quizData = SLIDES[slideIdx];
  if (optionIdx === quizData.a) {
    solvedQuizzes.add(slideIdx);
    openCutIn(true, "正解！", quizData.e, "次へ進む", () => { showSlide(slideIdx + 1); });
    triggerBlueStars();
  } else { openCutIn(false, "不正解…", quizData.h, "もう一度挑戦", null); }
}

  ov.className = "show " + (isCorrect ? "ok" : "ng");
  ovTitle.textContent = title;

  ovBtn.textContent = btnText;

}

/* ===== スライド15：カットイン自由記述問題 ===== */
function openQuestion() {
  qInput.value = "";
  qov.className = "show";
  requestAnimationFrame(() => { requestAnimationFrame(() => { qov.classList.add("in"); setTimeout(() => qInput.focus(), 350); }); });
}


function closeQuestion() { qov.className = ""; }


function submitQuestion() {
  const v = parseFloat(qInput.value);
  if (isNaN(v)) { qInput.focus(); return; }
  if (Math.abs(v - 4.5) < 0.01) {
    solvedQuizzes.add(currentSlide);
    closeQuestion();
    openCutIn(true, "正解！", "右腕1本は9%。腹側（前面）だけなので、その半分の4.5%です！", "次へ進む", () => { showSlide(currentSlide + 1); });
    triggerBlueStars();
  } else {
    openCutIn(false, "不正解…", "右腕1本（全周）は9%です。「腹側だけ」は全周の何分の一でしょう？", "もう一度挑戦", null);
  }
}


document.getElementById("qBtn").onclick = submitQuestion;
document.getElementById("qBack").onclick = closeQuestion;
qInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitQuestion(); });

  if (!box) return;
  if (typeof THREE === "undefined") {
    box.innerHTML = '<p style="padding:20px;">3D表示ライブラリを読み込めませんでした。ネットワーク接続を確認してください。</p>';
    return;
  }
  BURN_COLORS = [0xf5d0b4, 0xff99bb, 0xff1e3c, 0x222222].map(h => new THREE.Color(h));


  b3.scene = new THREE.Scene();
  b3.camera = new THREE.PerspectiveCamera(45, Math.max(1, box.clientWidth) / Math.max(1, box.clientHeight), 0.1, 100);
  b3.camera.position.set(0, 1.05, 8.5);


  b3.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  b3.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  b3.renderer.setSize(box.clientWidth, box.clientHeight);
  box.appendChild(b3.renderer.domElement);


  b3.scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dl = new THREE.DirectionalLight(0xbc13fe, 1);
  dl.position.set(5, 5, 5);
  b3.scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.5);
  dl2.position.set(-3, 3, -6);
  b3.scene.add(dl2);


  b3.mannequin = new THREE.Group();
  b3.scene.add(b3.mannequin);
  b3.blisters = new THREE.Group();
  b3.mannequin.add(b3.blisters);


  // 画面右側が傷病者の左側（正面向き）
  const defs = [
    ["head", new THREE.SphereGeometry(0.5, 32, 32), 0, 2.8],
    ["chest", new THREE.BoxGeometry(1.2, 0.8, 0.6), 0, 2.0],
    ["abdomen", new THREE.BoxGeometry(1.1, 0.7, 0.5), 0, 1.3],
    ["rArm", new THREE.CylinderGeometry(0.15, 0.1, 1.4, 16), -0.8, 1.8],
    ["lArm", new THREE.CylinderGeometry(0.15, 0.1, 1.4, 16), 0.8, 1.8],
    ["groin", new THREE.ConeGeometry(0.3, 0.3, 4), 0, 0.9],
    ["rThigh", new THREE.CylinderGeometry(0.25, 0.2, 1.0, 16), -0.35, 0.3],
    ["lThigh", new THREE.CylinderGeometry(0.25, 0.2, 1.0, 16), 0.35, 0.3],
    ["rShin", new THREE.CylinderGeometry(0.2, 0.15, 1.0, 16), -0.35, -0.7],
    ["lShin", new THREE.CylinderGeometry(0.2, 0.15, 1.0, 16), 0.35, -0.7]
  ];
  defs.forEach(([name, geo, x, y]) => {
    const g = geo.toNonIndexed();
    g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 3), 3));
    const mat = new THREE.MeshPhongMaterial({ color: 0xffffff, vertexColors: true });
    const mesh = new THREE.Mesh(g, mat);
    mesh.position.set(x, y, 0);
    b3.mannequin.add(mesh);
    b3.parts[name] = { mesh: mesh, f: 0, b: 0 };
    paintBurnPart(b3.parts[name]);
  });


  box.addEventListener("pointerdown", (e) => {
    burnDragging = true;
    burnPrevX = e.clientX;
    try { box.setPointerCapture(e.pointerId); } catch (err) {}
  });
  box.addEventListener("pointermove", (e) => {
    if (!burnDragging) return;
    b3.mannequin.rotation.y += (e.clientX - burnPrevX) * 0.012;
    burnPrevX = e.clientX;
  });
  const endDrag = () => { burnDragging = false; };
  box.addEventListener("pointerup", endDrag);
  box.addEventListener("pointercancel", endDrag);


  burnReady = true;
}


function paintBurnPart(p) {
  const geo = p.mesh.geometry;
  const pos = geo.attributes.position;
  const col = geo.attributes.color;
  for (let i = 0; i < pos.count; i += 3) {
    const z = (pos.getZ(i) + pos.getZ(i + 1) + pos.getZ(i + 2)) / 3;
    const c = BURN_COLORS[z >= 0 ? p.f : p.b];
    for (let j = 0; j < 3; j++) col.setXYZ(i + j, c.r, c.g, c.b);
  }
  col.needsUpdate = true;
}


function addBurnBlisters(part, sign) {
  const mesh = part.mesh;
  const bbox = new THREE.Box3().setFromObject(mesh);
  const size = bbox.getSize(new THREE.Vector3());
  const rc = new THREE.Raycaster();
  const geo = new THREE.SphereGeometry(0.045, 8, 8);
  const mat = new THREE.MeshPhongMaterial({ color: 0x00ffff, transparent: true, opacity: 0.75 });
  let placed = 0, tries = 0;
  while (placed < 10 && tries < 80) {
    tries++;
    const x = bbox.min.x + Math.random() * size.x;
    const y = bbox.min.y + Math.random() * size.y;
    rc.set(new THREE.Vector3(x, y, sign * 6), new THREE.Vector3(0, 0, -sign));
    const hit = rc.intersectObject(mesh, false)[0];
    if (hit) {
      const b = new THREE.Mesh(geo, mat);
      b.position.set(hit.point.x, hit.point.y, hit.point.z + sign * 0.02);
      b3.blisters.add(b);
      placed++;
    }
  }
}


function resetBurnMannequin() {
  if (!burnReady) return;
  Object.values(b3.parts).forEach(p => {
    p.f = 0; p.b = 0;
    p.mesh.material.emissive.setRGB(0, 0, 0);
    paintBurnPart(p);
  });
  while (b3.blisters.children.length > 0) { b3.blisters.remove(b3.blisters.children[0]); }
  b3.mannequin.rotation.y = 0;
  b3.mannequin.updateMatrixWorld(true);
}


function burn3dLoop() {
  b3.raf = requestAnimationFrame(burn3dLoop);
  const t = Date.now() * 0.005;
  Object.values(b3.parts).forEach(p => {
    if (p.f === 3 || p.b === 3) { const g = Math.sin(t) * 0.08 + 0.08; p.mesh.material.emissive.setRGB(g, g, g); }
  });
  b3.blisters.children.forEach(b => { const s = 1 + Math.sin(t + b.position.y * 10) * 0.1; b.scale.set(s, s, s); });
  b3.renderer.render(b3.scene, b3.camera);
}


function startBurn3d() { if (burnReady && !b3.raf) burn3dLoop(); }
function stopBurn3d() { if (b3.raf) { cancelAnimationFrame(b3.raf); b3.raf = null; } }


function resizeBurn3d() {
  if (!burnReady) return;
  const box = document.getElementById("burn3dBox");
  if (!box || box.clientWidth === 0 || box.clientHeight === 0) return;
  b3.camera.aspect = box.clientWidth / box.clientHeight;
  b3.camera.updateProjectionMatrix();
  b3.renderer.setSize(box.clientWidth, box.clientHeight);
}
window.addEventListener("resize", resizeBurn3d);


function setBurnMode(mode) {
  burnMode = mode;
  document.getElementById("modeAdultBtn").classList.toggle("active", mode === "adult");
  document.getElementById("modeChildBtn").classList.toggle("active", mode === "child");
  generateRandomBurnScenario();
}


function generateRandomBurnScenario() {
  if (!burnReady) return;
  resetBurnMannequin();
  const rules = BURN_RULES[burnMode].slice().sort(() => Math.random() - 0.5);
  const picked = rules.slice(0, 2 + Math.floor(Math.random() * 3));
  const sideName = { front: "前面", back: "背面", around: "全周" };
  const degName = ["", "Ⅰ度", "Ⅱ度", "Ⅲ度"];
  let total = 0;
  const lines = [];
  picked.forEach((r, i) => {
    let [label, partName, side, value] = r;
    let deg = 1 + Math.floor(Math.random() * 3);
    if (i === 0 && deg === 1) deg = 2 + Math.floor(Math.random() * 2);
    if (side === "around" && Math.random() < 0.2) {
      side = Math.random() < 0.5 ? "front" : "back";
      value = value / 2;
    }
    const p = b3.parts[partName];
    if (side === "front" || side === "around") p.f = deg;
    if (side === "back" || side === "around") p.b = deg;
    paintBurnPart(p);
    if (deg === 2) {
      if (side === "front" || side === "around") addBurnBlisters(p, 1);
      if (side === "back" || side === "around") addBurnBlisters(p, -1);
    }
    if (deg >= 2) { total += value; lines.push(`${label}（${sideName[side]}）${degName[deg]}：${value}%`); }
    else { lines.push(`${label}（${sideName[side]}）${degName[deg]}：除外`); }
  });
  mannequinScenario.correctTbsa = Math.round(total * 10) / 10;
  mannequinScenario.lines = lines;
  const resDiv = document.getElementById("tbsaEvalResult");
  if (resDiv) { resDiv.textContent = "新しい症例が生成されました。深達度を見極めてTBSA%を入力してください。"; resDiv.style.color = "var(--text-main)"; }
  const inp = document.getElementById("userTbsaInput");
  if (inp) inp.value = "";
}


function verifyTbsaAnswer() {
  const inputEl = document.getElementById("userTbsaInput");
  const userVal = parseFloat(inputEl.value);
  const correct = mannequinScenario.correctTbsa;
  const resDiv = document.getElementById("tbsaEvalResult");
  if (isNaN(userVal)) { resDiv.textContent = "数値を入力してください。"; resDiv.style.color = "var(--accent-red)"; return; }
  if (Math.abs(userVal - correct) < 0.05) {
    solvedQuizzes.add(currentSlide);
    nextBtn.disabled = false;
    openCutIn(true, "正解！", `正確なTBSA算定（${correct}%）です！1度熱傷を除外した評価ができています。\n\n【内訳】\n${mannequinScenario.lines.join("\n")}`, "次へ進む", () => { showSlide(currentSlide + 1); });
    triggerBlueStars();
  } else {
    resDiv.textContent = `不正解… 入力: ${userVal}% (※【1度熱傷はTBSAから除外】されているか再確認してください)`;
    resDiv.style.color = "var(--accent-red)";
    openCutIn(false, "算定エラー", "1度熱傷（ピンク色）はTBSA計算から除外します！2度（赤）と3度（黒）の部位のみを加算してください。前面・背面も回転して確認しましょう。", "もう一度計算する", null);
  }
}


function checkNgGame() {
  const checked = document.querySelectorAll(".ng-chk:checked");
  let ngSelectedCount = 0;
  let correctOkSelected = false;
  checked.forEach(c => { if (c.dataset.ng === "1") ngSelectedCount++; if (c.dataset.ng === "0") correctOkSelected = true; });
  const res = document.getElementById("ngResult");
  if (ngSelectedCount === 3 && !correctOkSelected) { res.innerHTML = `<span style="color:#00f0ff;">パーフェクト正解！</span><br>3つの危険なNG行動（無理な脱衣・水疱部圧迫マンシェット・長時間の冷水冷却）をすべて見抜きました！`; }
  else { res.innerHTML = `<span style="color:#ff0055;">再確認が必要です！</span><br>NG行動は「固着衣服の剥離」「水疱部のマンシェット圧迫」「20分の長冷水冷却」の3つです。（スクープストレッチャーは正しい処置です）`; }
}


function copyAllEmuData() {
  const e1 = document.getElementById("emu1_input")?.value.trim() || "（未入力）";
  const e2 = document.getElementById("emu2_input")?.value.trim() || "（未入力）";
  const e3 = document.getElementById("emu3_input")?.value.trim() || "（未入力）";
  const e4 = document.getElementById("emu4_input")?.value.trim() || "（未入力）";
  const fullReport = `【火災事例 傷病者救急活動 総合エミュレーション考察記録】\n\n■ 1. 出動指令フェーズ (想起疾患・準備資材)\n${e1}\n\n■ 2. 出場途上フェーズ (隊員間ブリーフィング・役割分担)\n${e2}\n\n■ 3. 現場到着・ABCDE評価フェーズ (観察・緊急介入)\n${e3}\n\n■ 4. 病院連絡・選定フェーズ (指示要請プレゼンテーション)\n${e4}`;
  navigator.clipboard.writeText(fullReport).then(() => {
    const msg = document.getElementById("copySuccessMsg");
    if (msg) { msg.style.display = "block"; setTimeout(() => msg.style.display = "none", 4000); }
  }).catch(() => { alert("コピーに失敗しました。手動でコピーしてください:\n\n" + fullReport); });
}


const emberCanvas = document.getElementById("emberCanvas");
const emberCtx = emberCanvas.getContext("2d");
let embers = [];
function resizeEmberCanvas() { emberCanvas.width = window.innerWidth; emberCanvas.height = window.innerHeight; }
resizeEmberCanvas(); addEventListener("resize", resizeEmberCanvas);
function createEmber() { return { x: Math.random() * emberCanvas.width, y: emberCanvas.height + 10, size: Math.random() * 3.5 + 1, speedY: Math.random() * 2 + 1, speedX: (Math.random() - 0.5) * 1.2, opacity: Math.random() * 0.8 + 0.2, hue: Math.floor(Math.random() * 40) }; }
for (let i = 0; i < 70; i++) { const e = createEmber(); e.y = Math.random() * emberCanvas.height; embers.push(e); }
function animateEmbers() {
  emberCtx.clearRect(0, 0, emberCanvas.width, emberCanvas.height);
  embers.forEach((e) => { e.y -= e.speedY; e.x += e.speedX; e.opacity -= 0.002; if (e.y < -10 || e.opacity <= 0) { Object.assign(e, createEmber()); } emberCtx.fillStyle = `hsla(${e.hue}, 100%, 60%, ${e.opacity})`; emberCtx.beginPath(); emberCtx.arc(e.x, e.y, e.size, 0, Math.PI * 2); emberCtx.fill(); });
  requestAnimationFrame(animateEmbers);
}
animateEmbers();


const starCanvas = document.getElementById("starCanvas");
const starCtx = starCanvas.getContext("2d");
let stars = []; let starRaf = null;
function resizeStarCanvas() { starCanvas.width = window.innerWidth; starCanvas.height = window.innerHeight; }
resizeStarCanvas(); addEventListener("resize", resizeStarCanvas);
function draw4PointStar(ctx, x, y, size, color, alpha) { ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, y - size); ctx.quadraticCurveTo(x, y, x + size, y); ctx.quadraticCurveTo(x, y, x, y + size); ctx.quadraticCurveTo(x, y, x - size, y); ctx.quadraticCurveTo(x, y, x, y - size); ctx.fill(); ctx.restore(); }
function triggerBlueStars() { stars = []; for (let i = 0; i < 10; i++) { stars.push({ x: Math.random() * (window.innerWidth * 0.8) + window.innerWidth * 0.1, y: Math.random() * (window.innerHeight * 0.6) + window.innerHeight * 0.2, size: Math.random() * 35 + 20, alpha: 1, scaleSpeed: Math.random() * 0.03 + 0.02 }); } if (!starRaf) animateStars(); }
function animateStars() { starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height); stars = stars.filter(s => s.alpha > 0.02); stars.forEach(s => { s.alpha -= 0.02; s.size += 0.8; draw4PointStar(starCtx, s.x, s.y, s.size, "#00f0ff", s.alpha); }); if (stars.length > 0) { starRaf = requestAnimationFrame(animateStars); } else { starRaf = null; starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height); } }


showSlide(0);
</script>
