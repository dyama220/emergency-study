<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>3D 救急医療・消防アクセスシミュレーションマップ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #050811;
            color: #ffffff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 外枠アニメーション */
        @keyframes animatedGradientBorder {
            0% {
                border-color: #001030;
                box-shadow: 0 0 10px rgba(0, 16, 48, 0.8);
            }
            50% {
                border-color: #7000ff;
                box-shadow: 0 0 15px rgba(112, 0, 255, 0.7);
            }
            100% {
                border-color: #00ff88;
                box-shadow: 0 0 15px rgba(0, 255, 136, 0.7);
            }
        }

        .gradient-border-card {
            border: 2px solid #7000ff;
            animation: animatedGradientBorder 5s infinite alternate ease-in-out;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .card-dark {
            background: rgba(6, 11, 24, 0.88);
            color: #f8fafc;
        }

        .card-light {
            background: rgba(255, 255, 255, 0.92);
            color: #0f172a;
        }

        .map-pin {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            z-index: 10;
        }

        .map-pin:hover {
            transform: translate(-50%, -50%) scale(1.15);
        }

        .pin-badge {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 8px;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .num-circle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 900;
            line-height: 1;
            margin-right: 1px;
        }
    </style>
</head>
<body class="night-theme">

    <!-- 3D WebGL Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 w-full h-full pointer-events-none flex flex-col justify-between p-3 sm:p-5">

        <!-- Top Right Navigation Buttons Only -->
        <div class="flex items-start justify-end w-full pointer-events-auto">
            <div class="flex flex-col gap-2">
                <button id="theme-btn" class="gradient-border-card card-dark rounded-full w-9 h-9 sm:w-11 sm:h-11 flex items-center justify-center shadow-2xl active:scale-95 transition-transform text-amber-400" title="昼夜切り替え">
                    <i id="theme-icon" class="fa-solid fa-moon text-sm sm:text-lg"></i>
                </button>
                <button id="reset-cam-btn" class="gradient-border-card card-dark rounded-full w-9 h-9 sm:w-11 sm:h-11 flex items-center justify-center shadow-2xl active:scale-95 transition-transform text-cyan-400" title="全体広域表示">
                    <i class="fa-solid fa-compress-arrows-alt text-xs sm:text-base"></i>
                </button>
            </div>
        </div>

        <!-- 3D World Space Screen Markers Container -->
        <div id="pins-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    </div>

    <!-- MAIN JAVASCRIPT -->
    <script>
        const LOCATIONS = {

            },

            },
            hospB: {

                icon: 'fa-brain',
                color: 0x06b6d4,
                pos: new THREE.Vector3(-280, 0, -200),
                pinHeight: 160,
                path: [
                    new THREE.Vector3(0, 0, 0),

            },
            hospC: {

        // 超広域カメラ設定（全施設がスマホ画面に確実に収まる視点）
        const DEFAULT_CAM_POS = new THREE.Vector3(80, 2200, 2100);
        const DEFAULT_CAM_TARGET = new THREE.Vector3(50, 0, 60);

        let scene, camera, renderer, controls;
        let isNight = true;
        let selectedLocId = null;
        const pinElements = {};

        let cityObjectsGroup = null;
        let leadLinesGroup = null;
        let rainbowTubeMesh = null;
        let activeHospTubeMesh = null;

        let ambLight, dirLight, hemiLight;

        const container = document.getElementById('canvas-container');
        const pinsContainer = document.getElementById('pins-container');
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');

        window.addEventListener('load', () => {
            initThree();
            buildComplexCityEnvironment();
            buildRainbowRoute();
            create3DPinsHTML();
            createLeadLines();
            bindEvents();
            animateLoop();

            resetToGlobalView();
        });

        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050811, 0.0003);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 6000);
            camera.position.copy(DEFAULT_CAM_POS);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.15;
            controls.minDistance = 35;
            controls.maxDistance = 3800;
            controls.target.copy(DEFAULT_CAM_TARGET);

            ambLight = new THREE.AmbientLight(0x1e293b, 0.8);
            scene.add(ambLight);

            hemiLight = new THREE.HemisphereLight(0x38bdf8, 0x0f172a, 0.5);
            hemiLight.position.set(0, 500, 0);
            scene.add(hemiLight);

            dirLight = new THREE.DirectionalLight(0x38bdf8, 1.3);
            dirLight.position.set(400, 700, 400);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 10;
            dirLight.shadow.camera.far = 3500;
            const d = 1400;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            leadLinesGroup = new THREE.Group();
            scene.add(leadLinesGroup);
        }

        /**
         * 各ポインターから地上建物へ繋がる点線リード線（ガイドライン）
         */
        function createLeadLines() {
            leadLinesGroup.clear();
            Object.values(LOCATIONS).forEach(loc => {
                const points = [
                    new THREE.Vector3(loc.pos.x, 0, loc.pos.z),
                    new THREE.Vector3(loc.pos.x, loc.pinHeight, loc.pos.z)
                ];
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineDashedMaterial({
                    color: loc.color,
                    dashSize: 8,
                    gapSize: 5,
                    linewidth: 2,
                    transparent: true,
                    opacity: 0.85
                });
                const line = new THREE.Line(geometry, material);
                line.computeLineDistances();
                leadLinesGroup.add(line);
            });
        }

        /**
         * 高密度都市、道路、ネオン発光建物の作成
         */
        function buildComplexCityEnvironment() {
            cityObjectsGroup = new THREE.Group();

            // グラウンド
            const groundGeo = new THREE.PlaneGeometry(3500, 3500);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x080f1e, roughness: 0.9, metalness: 0.1 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            cityObjectsGroup.add(ground);

            // 格子状道路網
            const gridHelper = new THREE.GridHelper(3000, 60, 0x1e293b, 0x0f172a);
            gridHelper.position.y = 0.5;
            cityObjectsGroup.add(gridHelper);

            // 複雑な立体・斜め・幹線道路網の生成
            const roadGroup = new THREE.Group();
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8, metalness: 0.2 });
            const lineMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, opacity: 0.6, transparent: true });

            // 道路データの定義 (始点, 終点, 幅)
            const roadsData = [
                // 主要幹線道路（東西・南北）
                { from: new THREE.Vector3(-1400, 0, 0), to: new THREE.Vector3(1400, 0, 0), width: 30 },
                { from: new THREE.Vector3(0, 0, -1400), to: new THREE.Vector3(0, 0, 1400), width: 30 },
                { from: new THREE.Vector3(-1400, 0, 300), to: new THREE.Vector3(1400, 0, 300), width: 24 },
                { from: new THREE.Vector3(-1400, 0, -300), to: new THREE.Vector3(1400, 0, -300), width: 24 },
                { from: new THREE.Vector3(400, 0, -1400), to: new THREE.Vector3(400, 0, 1400), width: 24 },
                { from: new THREE.Vector3(-400, 0, -1400), to: new THREE.Vector3(-400, 0, 1400), width: 24 },
                
                // 消防署・現場・病院を網羅する斜め幹線道路
                { from: new THREE.Vector3(-180, 0, 140), to: new THREE.Vector3(0, 0, 0), width: 20 },
                { from: new THREE.Vector3(0, 0, 0), to: new THREE.Vector3(680, 0, 480), width: 22 },
                { from: new THREE.Vector3(0, 0, 0), to: new THREE.Vector3(-280, 0, -200), width: 18 },
                { from: new THREE.Vector3(0, 0, 0), to: new THREE.Vector3(320, 0, 280), width: 18 },
                { from: new THREE.Vector3(0, 0, 0), to: new THREE.Vector3(420, 0, -320), width: 20 },
                { from: new THREE.Vector3(0, 0, 0), to: new THREE.Vector3(-560, 0, 260), width: 20 },

                // 都市全体を張り巡らす副幹線道路・対角バイパス
                { from: new THREE.Vector3(-1200, 0, -1000), to: new THREE.Vector3(1200, 0, 1000), width: 16 },
                { from: new THREE.Vector3(-1000, 0, 1200), to: new THREE.Vector3(1000, 0, -1200), width: 16 },
                { from: new THREE.Vector3(-800, 0, -600), to: new THREE.Vector3(800, 0, -600), width: 16 },
                { from: new THREE.Vector3(-800, 0, 600), to: new THREE.Vector3(800, 0, 600), width: 16 },
                { from: new THREE.Vector3(-600, 0, -1200), to: new THREE.Vector3(-600, 0, 1200), width: 16 },
                { from: new THREE.Vector3(600, 0, -1200), to: new THREE.Vector3(600, 0, 1200), width: 16 }
            ];

            roadsData.forEach(r => {
                const length = r.from.distanceTo(r.to);
                const roadGeo = new THREE.PlaneGeometry(r.width, length);
                const roadMesh = new THREE.Mesh(roadGeo, roadMat);

                // 中間位置と回転角を設定
                const midPoint = new THREE.Vector3().addVectors(r.from, r.to).multiplyScalar(0.5);
                roadMesh.position.set(midPoint.x, 0.8, midPoint.z);

                const angle = Math.atan2(r.to.x - r.from.x, r.to.z - r.from.z);
                roadMesh.rotation.x = -Math.PI / 2;
                roadMesh.rotation.z = -angle;

                roadGroup.add(roadMesh);

                // 中央白線マーク
                const lineGeo = new THREE.PlaneGeometry(1.2, length);
                const lineMesh = new THREE.Mesh(lineGeo, lineMat);
                lineMesh.position.set(midPoint.x, 1.0, midPoint.z);
                lineMesh.rotation.x = -Math.PI / 2;
                lineMesh.rotation.z = -angle;
                roadGroup.add(lineMesh);
            });

            cityObjectsGroup.add(roadGroup);

            // 目標建造物（ネオン発光）の配置
            Object.values(LOCATIONS).forEach(loc => {
                const bHeight = 40 + Math.random() * 30;
                const bGeo = new THREE.BoxGeometry(36, bHeight, 36);
                const bMat = new THREE.MeshStandardMaterial({
                    color: loc.color,
                    emissive: loc.color,
                    emissiveIntensity: 0.7,
                    roughness: 0.3,
                    metalness: 0.8
                });
                const bMesh = new THREE.Mesh(bGeo, bMat);
                bMesh.position.set(loc.pos.x, bHeight / 2, loc.pos.z);
                bMesh.castShadow = true;
                bMesh.receiveShadow = true;
                cityObjectsGroup.add(bMesh);

                // 屋上ビーコン発光体
                const beaconGeo = new THREE.SphereGeometry(6, 16, 16);
                const beaconMat = new THREE.MeshBasicMaterial({ color: loc.color });
                const beacon = new THREE.Mesh(beaconGeo, beaconMat);
                beacon.position.set(loc.pos.x, bHeight + 6, loc.pos.z);
                cityObjectsGroup.add(beacon);
            });

            // 一般ビル群の自動生成
            const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
            for (let i = 0; i < 220; i++) {
                const bx = (Math.random() - 0.5) * 2600;
                const bz = (Math.random() - 0.5) * 2600;

                // スポット周辺は少し離す
                let tooClose = false;
                Object.values(LOCATIONS).forEach(loc => {
                    if (loc.pos.distanceTo(new THREE.Vector3(bx, 0, bz)) < 65) tooClose = true;
                });
                if (tooClose) continue;

                const bw = 20 + Math.random() * 35;
                const bh = 30 + Math.random() * 120;
                const bd = 20 + Math.random() * 35;

                const bMat = new THREE.MeshStandardMaterial({
                    color: 0x152033,
                    roughness: 0.7,
                    metalness: 0.2
                });
                const mesh = new THREE.Mesh(buildingGeo, bMat);
                mesh.position.set(bx, bh / 2, bz);
                mesh.scale.set(bw, bh, bd);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                cityObjectsGroup.add(mesh);
            }

            scene.add(cityObjectsGroup);
            // 街並み（都市オブジェクト）を常時表示に設定
            cityObjectsGroup.visible = true;
        }

        /**
         * 消防署〜現場間の七色（虹色）アニメーション光線の構築
         */
        function buildRainbowRoute() {
            const curve = new THREE.CatmullRomCurve3(LOCATIONS.station.path);
            const tubeGeo = new THREE.TubeGeometry(curve, 64, 2.5, 8, false);

            const uniforms = {
                uTime: { value: 0 }
            };

            const rainbowMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    varying vec2 vUv;

                    vec3 rainbow(float t) {
                        return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67)));
                    }

                    void main() {
                        float speed = vUv.x - uTime * 0.4;
                        vec3 col = rainbow(speed);
                        gl_FragColor = vec4(col, 0.95);
                    }
                `,
                transparent: true
            });

            rainbowTubeMesh = new THREE.Mesh(tubeGeo, rainbowMat);
            rainbowTubeMesh.position.y = 1.5;
            rainbowTubeMesh.userData.uniforms = uniforms;
            scene.add(rainbowTubeMesh);
            rainbowTubeMesh.visible = true;
        }

        /**
         * 消防署〜現場間の七色（虹色）アニメーション光線の構築
         */
        function buildRainbowRoute() {
            const curve = new THREE.CatmullRomCurve3(LOCATIONS.station.path);
            const tubeGeo = new THREE.TubeGeometry(curve, 64, 2.5, 8, false);

            const uniforms = {
                uTime: { value: 0 }
            };

            const rainbowMat = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    varying vec2 vUv;

                    vec3 rainbow(float t) {
                        return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67)));
                    }

                    void main() {
                        float speed = vUv.x - uTime * 0.4;
                        vec3 col = rainbow(speed);
                        gl_FragColor = vec4(col, 0.95);
                    }
                `,
                transparent: true
            });

            rainbowTubeMesh = new THREE.Mesh(tubeGeo, rainbowMat);
            rainbowTubeMesh.position.y = 1.5;
            rainbowTubeMesh.userData.uniforms = uniforms;
            scene.add(rainbowTubeMesh);
        }

        /**
         * 搬送先病院ルートの表示
         */
        function drawHospitalRoute(hospLoc) {
            clearHospitalRoute();
            if (!hospLoc || !hospLoc.path) return;

            const curve = new THREE.CatmullRomCurve3(hospLoc.path);
            const tubeGeo = new THREE.TubeGeometry(curve, 64, 2.0, 8, false);
            const mat = new THREE.MeshBasicMaterial({ color: hospLoc.color, transparent: true, opacity: 0.9 });

            activeHospTubeMesh = new THREE.Mesh(tubeGeo, mat);
            activeHospTubeMesh.position.y = 1.5;
            scene.add(activeHospTubeMesh);
        }

        function clearHospitalRoute() {
            if (activeHospTubeMesh) {
                scene.remove(activeHospTubeMesh);
                activeHospTubeMesh.geometry.dispose();
                activeHospTubeMesh.material.dispose();
                activeHospTubeMesh = null;
            }
        }

        /**
         * HTMLポインター（①〜⑦）の生成
         */
        function create3DPinsHTML() {
            pinsContainer.innerHTML = '';
            Object.values(LOCATIONS).forEach(loc => {
                const el = document.createElement('div');
                el.className = 'map-pin';
                el.innerHTML = `
                    <div class="pin-badge ${loc.badgeBg} gradient-border-card">
                        <span class="num-circle">${loc.num}</span>
                        <i class="fa-solid ${loc.icon}"></i>
                        <span>${loc.name.replace(/^. /, '')}</span>
                    </div>
                `;
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectLocation(loc.id);
                });
                pinsContainer.appendChild(el);
                pinElements[loc.id] = el;
            });
        }

        /**
         * スクリーン座標計算とポインター追従更新
         */
        function update3DPinsPosition() {
            const tempV = new THREE.Vector3();
            Object.values(LOCATIONS).forEach(loc => {
                const el = pinElements[loc.id];
                if (!el) return;

                // ポインターを空中のランダムな高さに反映
                tempV.copy(loc.pos);
                tempV.y += loc.pinHeight;
                tempV.project(camera);

                const x = (tempV.x *  .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                if (tempV.z > 1) {
                    el.style.opacity = '0';
                } else {
                    el.style.opacity = '1';
                    el.style.left = `${x}px`;
                    el.style.top = `${y}px`;
                }
            });
        }

        function selectLocation(locId) {
            const loc = LOCATIONS[locId];
            if (!loc) return;

            selectedLocId = locId;

            if (cityObjectsGroup) cityObjectsGroup.visible = true;
            if (rainbowTubeMesh) rainbowTubeMesh.visible = true;

            const targetCamPos = new THREE.Vector3().copy(loc.pos).add(new THREE.Vector3(0, loc.pinHeight + 100, 200));
            gsap.to(camera.position, {
                x: targetCamPos.x,
                y: targetCamPos.y,
                z: targetCamPos.z,
                duration: 1.4,
                ease: 'power2.inOut'
            });

            gsap.to(controls.target, {
                x: loc.pos.x,
                y: loc.pos.y,
                z: loc.pos.z,
                duration: 1.4,
                ease: 'power2.inOut'
            });

            if (locId.startsWith('hosp')) {
                drawHospitalRoute(loc);
            } else {
                clearHospitalRoute();
            }
        }

        function resetToGlobalView() {
            selectedLocId = null;

            // 超広域時でも街並みと虹色ルートを表示状態に維持
            if (cityObjectsGroup) cityObjectsGroup.visible = true;
            if (rainbowTubeMesh) rainbowTubeMesh.visible = true;
            clearHospitalRoute();

            gsap.to(camera.position, {
                x: DEFAULT_CAM_POS.x,
                y: DEFAULT_CAM_POS.y,
                z: DEFAULT_CAM_POS.z,
                duration: 1.5,
                ease: 'power2.inOut'
            });

            gsap.to(controls.target, {
                x: DEFAULT_CAM_TARGET.x,
                y: DEFAULT_CAM_TARGET.y,
                z: DEFAULT_CAM_TARGET.z,
                duration: 1.5,
                ease: 'power2.inOut'
            });
        }

        function toggleDayNight() {
            isNight = !isNight;

            if (isNight) {
                themeIcon.className = 'fa-solid fa-moon text-sm sm:text-lg text-amber-400';
                scene.fog.color.setHex(0x050811);
                renderer.setClearColor(0x050811, 1);
                ambLight.intensity = 0.8;
                dirLight.intensity = 1.3;
            } else {
                themeIcon.className = 'fa-solid fa-sun text-sm sm:text-lg text-amber-500';
                scene.fog.color.setHex(0xe2e8f0);
                renderer.setClearColor(0xbae6fd, 1);
                ambLight.intensity = 1.5;
                dirLight.intensity = 1.8;
            }
        }

        function bindEvents() {
            themeBtn.addEventListener('click', toggleDayNight);
            document.getElementById('reset-cam-btn').addEventListener('click', resetToGlobalView);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);

            const time = performance.now() * 0.001;

            if (rainbowTubeMesh && rainbowTubeMesh.userData.uniforms && rainbowTubeMesh.visible) {
                rainbowTubeMesh.userData.uniforms.uTime.value = time;
            }

            controls.update();
            update3DPinsPosition();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
